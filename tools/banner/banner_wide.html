<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:400px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#fff;position:relative;
 background:radial-gradient(ellipse 900px 640px at 18% 22%,#1f3a30 0%,#14201c 45%,#0d1211 100%)}
.wm{position:absolute;right:-60px;top:-70px;width:360px;opacity:.06}

h1{margin:0;font-size:84px;font-weight:800;letter-spacing:-3px;line-height:1}

.tag{margin-top:6px;font-size:18px;color:#9aa6a1}
.chips{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;max-width:820px}
.chip{padding:5px 13px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
 font-size:16px;color:#dfe6e3}
.chip b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:2px}
</style></head><body>
